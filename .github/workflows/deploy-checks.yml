name: Checks (timesheet)

# The timesheet web app is plain JavaScript (no tests/typecheck), so CI = lint + build.
# The build also proves config.js's env hardening works: it needs the NEXT_PUBLIC_
# Supabase vars set (placeholders below) and would fail loudly without them.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Build-time placeholders (publishable/anon shape; not a real project).
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_AI_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
